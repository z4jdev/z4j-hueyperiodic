[project]
name = "z4j-hueyperiodic"
version = "1.6.7"
description = "z4j scheduler adapter for Huey @periodic_task (Apache 2.0)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "z4j contributors" }]
keywords = ["z4j", "huey", "scheduler", "periodic"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "z4j-core>=1.4.0,<2",
    # Huey compatibility policy: operator-chosen primary, wide range.
    # Adapter explicitly handles both Huey 2.x legacy ``_periodic``
    # and Huey 3.x ``periodic_tasks`` shapes (scheduler.py:184-196),
    # so the floor can drop to the registry-internals shape that 2.4
    # matches. ``<4`` retained.
    "huey>=2.4,<4",
]

[project.urls]
Changelog = "https://github.com/z4jdev/z4j-hueyperiodic/blob/main/CHANGELOG.md"
Documentation = "https://z4j.dev"
Homepage = "https://z4j.com"
Issues = "https://github.com/z4jdev/z4j-hueyperiodic/issues"
Source = "https://github.com/z4jdev/z4j-hueyperiodic"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/z4j_hueyperiodic"]
