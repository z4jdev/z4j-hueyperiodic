[project]
name = "z4j-hueyperiodic"
version = "1.12.1"
description = "z4j scheduler adapter for Huey @periodic_task (Apache 2.0)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "z4j contributors" }]
keywords = ["z4j", "huey", "scheduler", "periodic"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "z4j-core>=1.12.0,<2",
    # Huey: a floor and no upper bound. The range is held by tests, not by
    # the resolver. The gate installs huey==2.4.0 and huey==3.4.0 into clean
    # environments (scripts/ci-local.sh, the Huey block of the adapterfloors
    # lane) and runs this package's whole suite on each, as well as on the
    # locked release. That suite runs a @periodic_task under a real consumer
    # and compares the inventory with what the scheduler ran
    # (tests/integration/test_real_engine.py).
    #
    # The adapter reads two things, both the same from Huey 2.4 through 3.4:
    # the registry's ``periodic_tasks`` and the closure of the crontab
    # validator. Huey 3.4's stepped and wrap-around crontab ranges render as
    # the explicit value list they expand to.
    "huey>=2.4",
]

[project.urls]
Changelog = "https://github.com/z4jdev/z4j-hueyperiodic/blob/main/CHANGELOG.md"
Documentation = "https://docs.z4j.com"
Homepage = "https://z4j.com"
Issues = "https://github.com/z4jdev/z4j-hueyperiodic/issues"
Source = "https://github.com/z4jdev/z4j-hueyperiodic"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/z4j_hueyperiodic"]
